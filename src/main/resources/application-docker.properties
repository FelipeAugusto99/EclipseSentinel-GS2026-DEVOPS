# =========================================================
# APPLICATION PROPERTIES - DOCKER / MYSQL
# =========================================================
# Este arquivo eh usado quando a aplicacao roda no Docker
# As variaveis de ambiente sao injetadas pelo docker-compose
 
spring.application.name=eclipse-sentinel
 
# BANCO DE DADOS - MYSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
 
server.port=8080
 